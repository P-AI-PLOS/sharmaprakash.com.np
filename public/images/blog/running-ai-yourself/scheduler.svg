<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 478" role="img" aria-label="Make room for an ongoing answer"><title>Make room for an ongoing answer</title><desc>Illustrative schedule: Alice has received 0 decode steps; Bob has processed 0 of 8 uncached prefill slices. Interleaving lets Alice progress before Bob finishes reading. Equal boxes do not imply equal durations; real engines can batch both kinds of work in one execution step.</desc><style>
