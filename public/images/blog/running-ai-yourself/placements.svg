<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" role="img" aria-label="Three different ways to share the work"><title>Three different ways to share the work</title><desc>Replicas serve separate requests; a split model requires communication during inference; remote KV transfer moves compatible state. Separate memory pools do not become one unified device.</desc><style>
    text{fill:#F8FAFC;font-family:Arial,sans-serif}rect{fill:#1E293B;stroke:#475569;stroke-width:2}.active rect{fill:#FEF3C7;stroke:#B45309;stroke-width:3}.wire{fill:none;stroke:#94A3B8;stroke-width:3}.wire.lit{stroke:#B45309;stroke-width:5}.budget-0{fill:#1E293B}.budget-1{fill:#94A3B8}.budget-2{fill:#E2E8F0}.budget-3{fill:#F59E0B}
  </style><text x="24" y="32" font-size="20" text-anchor="start">REPLICAS · route separate requests</text><g class="idle"><rect x="24" y="55" width="205" height="54" rx="10"/><text x="126.5" y="88" font-size="20" text-anchor="middle">Model on A</text></g><g class="idle"><rect x="251" y="55" width="205" height="54" rx="10"/><text x="353.5" y="88" font-size="20" text-anchor="middle">Model on B</text></g><text x="24" y="160" font-size="20" text-anchor="start">SPLIT MODEL · communicate to answer</text><g class="idle"><rect x="24" y="183" width="205" height="54" rx="10"/><text x="126.5" y="216" font-size="20" text-anchor="middle">Layers on A</text></g><g class="idle"><rect x="251" y="183" width="205" height="54" rx="10"/><text x="353.5" y="216" font-size="20" text-anchor="middle">Layers on B</text></g><text x="240" y="220" font-size="24" text-anchor="middle">↔</text><text x="24" y="288" font-size="20" text-anchor="start">KV TRANSFER · reuse compatible state</text><g class="idle"><rect x="24" y="311" width="205" height="54" rx="10"/><text x="126.5" y="344" font-size="20" text-anchor="middle">Cache source</text></g><g class="idle"><rect x="251" y="311" width="205" height="54" rx="10"/><text x="353.5" y="344" font-size="20" text-anchor="middle">Model worker</text></g><text x="240" y="348" font-size="24" text-anchor="middle">→</text></svg>
