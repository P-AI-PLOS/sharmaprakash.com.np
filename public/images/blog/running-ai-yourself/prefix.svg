<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" role="img" aria-label="Change a block. What can still be reused?"><title>Change a block. What can still be reused?</title><desc>The upper row is retained state for A → B → C → D. Choose what changes, then inspect each new block. Letters illustrate dependencies, not real cache-block sizes.</desc><style>
    text{fill:#F8FAFC;font-family:Arial,sans-serif}rect{fill:#1E293B;stroke:#475569;stroke-width:2}.active rect{fill:#FEF3C7;stroke:#B45309;stroke-width:3}.wire{fill:none;stroke:#94A3B8;stroke-width:3}.wire.lit{stroke:#B45309;stroke-width:5}.budget-0{fill:#1E293B}.budget-1{fill:#94A3B8}.budget-2{fill:#E2E8F0}.budget-3{fill:#F59E0B}
  </style><text x="24" y="32" font-size="20" text-anchor="start">Previous state: retained</text><g class="idle"><rect x="24" y="52" width="106" height="54" rx="10"/><text x="77" y="85" font-size="20" text-anchor="middle">A</text></g><g class="idle"><rect x="138" y="52" width="106" height="54" rx="10"/><text x="191" y="85" font-size="20" text-anchor="middle">B</text></g><g class="idle"><rect x="252" y="52" width="106" height="54" rx="10"/><text x="305" y="85" font-size="20" text-anchor="middle">C</text></g><g class="idle"><rect x="366" y="52" width="106" height="54" rx="10"/><text x="419" y="85" font-size="20" text-anchor="middle">D</text></g><text x="24" y="152" font-size="20" text-anchor="start">New request: inspect from the start</text><g class="idle"><rect x="24" y="178" width="106" height="76" rx="10"/><text x="77" y="211" font-size="20" text-anchor="middle">A</text><text x="77" y="238" font-size="17" text-anchor="middle">waiting</text></g><g class="idle"><rect x="138" y="178" width="106" height="76" rx="10"/><text x="191" y="211" font-size="20" text-anchor="middle">B</text><text x="191" y="238" font-size="17" text-anchor="middle">waiting</text></g><g class="idle"><rect x="252" y="178" width="106" height="76" rx="10"/><text x="305" y="211" font-size="20" text-anchor="middle">C</text><text x="305" y="238" font-size="17" text-anchor="middle">waiting</text></g><g class="idle"><rect x="366" y="178" width="106" height="76" rx="10"/><text x="419" y="211" font-size="20" text-anchor="middle">E</text><text x="419" y="238" font-size="17" text-anchor="middle">waiting</text></g><text x="24" y="302" font-size="19" text-anchor="start">A  instructions + tools</text><text x="24" y="335" font-size="19" text-anchor="start">B  policy    C  invoice code</text><text x="24" y="368" font-size="19" text-anchor="start">D / E  different questions</text></svg>
