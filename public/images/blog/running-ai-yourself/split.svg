<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" role="img" aria-label="Layer splitting or tensor splitting?"><title>Layer splitting or tensor splitting?</title><desc>Layer split: GPU A holds earlier layers; GPU B holds later layers. Follow a single request through the stages.</desc><style>
    text{fill:#F8FAFC;font-family:Arial,sans-serif}rect{fill:#1E293B;stroke:#475569;stroke-width:2}.active rect{fill:#FEF3C7;stroke:#B45309;stroke-width:3}.wire{fill:none;stroke:#94A3B8;stroke-width:3}.wire.lit{stroke:#B45309;stroke-width:5}.budget-0{fill:#1E293B}.budget-1{fill:#94A3B8}.budget-2{fill:#E2E8F0}.budget-3{fill:#F59E0B}
  </style><g class="idle"><rect x="24" y="28" width="200" height="76" rx="10"/><text x="124" y="61" font-size="20" text-anchor="middle">GPU A</text><text x="124" y="88" font-size="17" text-anchor="middle">earlier layers</text></g><g class="idle"><rect x="256" y="28" width="200" height="76" rx="10"/><text x="356" y="61" font-size="20" text-anchor="middle">GPU B</text><text x="356" y="88" font-size="17" text-anchor="middle">later layers</text></g><path class="wire " d="M124 104V228H356V104"/><g class="idle"><rect x="145" y="202" width="190" height="54" rx="10"/><text x="240" y="235" font-size="20" text-anchor="middle">PCIe switch</text></g><text x="240" y="327" font-size="23" text-anchor="middle">A → B  activations</text><text x="240" y="370" font-size="17" text-anchor="middle">Path highlights are not bandwidth measurements.</text></svg>
