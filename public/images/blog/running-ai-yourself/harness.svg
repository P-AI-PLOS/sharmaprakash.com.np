<g text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#F8FAFC"><text x="120" y="251">requests ↕ outputs</text><text x="360" y="251">actions ↕ results</text><text x="240" y="474" font-size="17" font-weight="600">Result with evidence</text><text x="240" y="501">Continue, finish, or surface a blocker</text></g></svg>
