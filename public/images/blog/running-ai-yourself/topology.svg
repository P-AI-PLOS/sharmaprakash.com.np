<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 505" role="img" aria-label="Follow the transfer path"><title>Follow the transfer path</title><desc>A supported peer transfer can remain below the switch. A host-staged fallback uses the upstream link and host memory. The drawing is conceptual, not a verified enclosure specification.</desc><style>
    text{fill:#F8FAFC;font-family:Arial,sans-serif}rect{fill:#1E293B;stroke:#475569;stroke-width:2}.active rect{fill:#FEF3C7;stroke:#B45309;stroke-width:3}.wire{fill:none;stroke:#94A3B8;stroke-width:3}.wire.lit{stroke:#B45309;stroke-width:5}.budget-0{fill:#1E293B}.budget-1{fill:#94A3B8}.budget-2{fill:#E2E8F0}.budget-3{fill:#F59E0B}
  </style><g class="idle"><rect x="40" y="22" width="400" height="54" rx="10"/><text x="240" y="55" font-size="17" text-anchor="middle">CPU + shared memory / integrated GPU</text></g><path class="wire lit" d="M240 76V196" stroke-dasharray="7 6"/><text x="255" y="135" font-size="18" text-anchor="start">upstream</text><g class="active"><rect x="150" y="196" width="180" height="54" rx="10"/><text x="240" y="229" font-size="20" text-anchor="middle">PCIe switch</text></g><path class="wire lit" d="M240 250V300H124V340 M240 300H356V340"/><g class="idle"><rect x="24" y="340" width="200" height="54" rx="10"/><text x="124" y="373" font-size="20" text-anchor="middle">GPU A + VRAM</text></g><g class="idle"><rect x="256" y="340" width="200" height="54" rx="10"/><text x="356" y="373" font-size="20" text-anchor="middle">GPU B + VRAM</text></g><text x="240" y="435" font-size="21" text-anchor="middle">Peer: A ↔ switch ↔ B</text><text x="240" y="474" font-size="21" text-anchor="middle">Fallback: A ↔ host memory ↔ B</text></svg>
