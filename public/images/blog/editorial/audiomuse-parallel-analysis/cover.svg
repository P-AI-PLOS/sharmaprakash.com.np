<svg xmlns="http://www.w3.org/2000/svg" width="1915" height="821" viewBox="0 0 1915 821" role="img" aria-label="Audio waveforms flowing through a job queue into a grid of parallel workers">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081423"/>
      <stop offset="0.58" stop-color="#12243a"/>
      <stop offset="1" stop-color="#1d1c3f"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fe6c1"/>
      <stop offset="1" stop-color="#4aa7ff"/>
    </linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#264a68"/>
      <stop offset="1" stop-color="#20294d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4fe6c1" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4fe6c1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8aa8c5" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <rect width="1915" height="821" fill="url(#background)"/>
  <rect width="1915" height="821" fill="url(#grid)"/>
  <circle cx="421" cy="400" r="340" fill="url(#glow)"/>
  <circle cx="1514" cy="370" r="440" fill="url(#glow)" opacity="0.45"/>

