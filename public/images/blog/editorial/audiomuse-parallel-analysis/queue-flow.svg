<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-label="Navidrome supplies 1,728 albums to one high-priority coordinator, which dispatches album jobs to 40 workers, up to 40 jobs in flight; the workers share PostgreSQL connections">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1d2b"/><stop offset="1" stop-color="#17233f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ce0c5"/><stop offset="1" stop-color="#61b4ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#68c8d8"/></marker>
  </defs>
  <rect width="1440" height="520" rx="32" fill="url(#bg)"/>
  <g fill="#152f43" stroke="#5792a5" stroke-width="2">
    <rect x="110" y="86" width="340" height="212" rx="24"/>
    <rect x="550" y="86" width="340" height="212" rx="24"/>
    <rect x="990" y="86" width="340" height="212" rx="24"/>
    <rect x="504" y="385" width="432" height="92" rx="24"/>
  </g>
  <g stroke="#68c8d8" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M450 192H538"/><path d="M890 192H978"/>
    <path d="M1160 304V350H720V373"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
    <text x="280" y="144" fill="#61dec7" font-size="18" font-weight="700" letter-spacing="2">LIBRARY</text>
    <text x="280" y="195" fill="#f2f7fb" font-size="34" font-weight="700">Navidrome</text>
    <text x="280" y="239" fill="#b9d0dd" font-size="20">1,728 selected albums</text>
    <text x="720" y="144" fill="#61dec7" font-size="18" font-weight="700" letter-spacing="2">HIGH PRIORITY</text>
    <text x="720" y="195" fill="#f2f7fb" font-size="31" font-weight="700">1 coordinator</text>
    <text x="720" y="239" fill="#b9d0dd" font-size="20">dispatches album jobs</text>
    <text x="1160" y="144" fill="#61dec7" font-size="18" font-weight="700" letter-spacing="2">ALBUM WORK</text>
    <text x="1160" y="195" fill="#f2f7fb" font-size="32" font-weight="700">40 workers</text>
    <text x="1160" y="239" fill="#b9d0dd" font-size="20">up to 40 album jobs in flight</text>
    <text x="720" y="424" fill="#f2f7fb" font-size="25" font-weight="700">PostgreSQL</text>
    <text x="720" y="454" fill="#b9d0dd" font-size="18">queue, progress, analysis data, connections</text>
  </g>
  <g fill="url(#accent)">
    <circle cx="1073" cy="273" r="5"/><circle cx="1098" cy="273" r="5"/><circle cx="1123" cy="273" r="5"/>
    <circle cx="1148" cy="273" r="5"/><circle cx="1173" cy="273" r="5"/><circle cx="1198" cy="273" r="5"/>
    <circle cx="1223" cy="273" r="5"/><circle cx="1248" cy="273" r="5"/>
  </g>
</svg>
