<text x="1682" y="598" font-size="17" fill="#334155" font-weight="400">192.168.20.0/28 / outside XCP-ng pools</text>
<text x="1682" y="631" font-size="17" fill="#334155" font-weight="400">No specific AP association asserted</text>
<text x="1682" y="674" font-size="17" fill="#334155" font-weight="400">Local test services are not LAN web endpoints.</text>
