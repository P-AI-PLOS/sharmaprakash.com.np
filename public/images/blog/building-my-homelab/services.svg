<text x="50" y="1147" font-size="17" fill="#16818b" font-weight="400">Factories: Product .10.36:9119 and Growth .10.40:9119 dashboards; Engineering .10.3:9120 owns Factory HQ.</text>
<text x="50" y="1178" font-size="16" fill="#16818b" font-weight="400">HQ: Factory .10.3 → factory-links.home HTTPS / Heimdall → HOP .10.36, HOG .10.40, Potts .10.38:8642; scoped grants.</text>
<text x="50" y="1208" font-size="16" fill="#946018" font-weight="400">Factory → Heimdall fixed SSH → optional Shuri Bonsai :8082 (64K, q4 KV); estate runs use ChatGPT subscription.</text>
<text x="50" y="1238" font-size="16" fill="#946018" font-weight="400">Factory → Campsite homelab-ops reports: existing route; delivery, post readback and scheduler hook verified.</text>
<text x="50" y="1268" font-size="16" fill="#946018" font-weight="400">Factory root broker → 16 Linux hosts: forced SSH helpers verified; Saturday 01:00 Nepal active, retained updater paused.</text>
<text x="50" y="1298" font-size="16" fill="#16818b" font-weight="400">Factory: source-admitted Kanban starts; infra host admin / isolated verifier; protected publisher and reporter release.</text>
<text x="50" y="1328" font-size="16" fill="#16818b" font-weight="400">NAS Forgejo .10.9 → Factory .10.3:8644: signed LAN HTTP; bounded reporter error-to-fix release verified.</text>
<text x="50" y="1358" font-size="16" fill="#16818b" font-weight="400">Trusted LAN / Teleport → Factory .10.3:9120: native Webapp / homelab room; full mobile administration unverified.</text>
<text x="50" y="1392" font-size="16" fill="#16818b" font-weight="400">Factory infra → Heimdall .10.8 / Cosmo .10.7 / Mbaku .10.30 / Namora .10.12: separate admin SSH key + sudo verified.</text>
<text x="50" y="1422" font-size="16" fill="#16818b" font-weight="400">Family Wi-Fi → McQueen / Borani .10.29 TCP 8765 only; access code; plain HTTP; full drive awaits Motor B.</text>
<text x="50" y="1452" font-size="16" fill="#16818b" font-weight="400">Google consent HTTPS → potts-auth.polo-apps.com → Cloudflare Tunnel / Heimdall → Potts .10.38:9121.</text>
<text x="50" y="1482" font-size="16" fill="#946018" font-weight="400">Only connect / callback / health paths; Hermes remains private. Owner consent completed; Google review incomplete.</text>
<text x="50" y="1520" font-size="16" fill="#16818b" font-weight="400">NAS tasks: Assistant Hub .10.38 → Factory .10.3:22 (restricted queue) → Vyas .10.9:22 (existing infra admin). Task route verified; photo transfer pending.</text>
