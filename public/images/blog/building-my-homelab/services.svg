<text x="1035" y="627" font-size="16" fill="#334155" font-weight="400">proxy</text>
<rect x="50" y="810" width="1500" height="210" rx="16" fill="#fff7e8" stroke="#dec599" stroke-width="2"/>
<text x="72" y="849" font-size="23" fill="#946018" font-weight="700">Boundaries &amp; evidence</text>
<text x="72" y="884" font-size="18" fill="#334155" font-weight="400">Family is not reachable through this documented route set; Guest is not advertised. An exit node is not required for home routes.</text>
<text x="72" y="918" font-size="18" fill="#334155" font-weight="400">Vyas recovery notes record approved routes and split DNS. This diagram does not re-verify provider state or remote phone access.</text>
<text x="72" y="952" font-size="18" fill="#334155" font-weight="400">The watchdog is source-only / not installed. No automatic recovery or redundant router is implied by this diagram.</text>
<text x="72" y="986" font-size="18" fill="#334155" font-weight="400">Cellular acceptance remains open: with Wi-Fi off and Tailscale connected, test homepage.home and vault.home.</text>
<text x="50" y="1062" font-size="16" fill="#64748b" font-weight="400">Sources: inventory/homelab.md#remote-access-tailscale • stacks/vyas-tailscale/README.md • docs/network/README.md</text>
</g></svg>
