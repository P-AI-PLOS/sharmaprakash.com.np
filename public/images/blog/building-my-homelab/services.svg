<text x="1132" y="573" font-size="23" fill="#334155" font-weight="700">Application destinations</text>
<text x="1132" y="614" font-size="18" fill="#334155" font-weight="400">Heimdall utility services</text>
<text x="1132" y="650" font-size="18" fill="#334155" font-weight="400">Cosmo applications</text>
<text x="1132" y="686" font-size="18" fill="#334155" font-weight="400">Vyas services / Jellyfin</text>
<text x="1132" y="723" font-size="16" fill="#64748b" font-weight="400">Overview only; see inventory for all services</text>
