<text x="72" y="849" font-size="23" fill="#946018" font-weight="700">Boundaries &amp; evidence</text>
<text x="72" y="884" font-size="18" fill="#334155" font-weight="400">Tailscale omits Family / Guest. Teleport source policy grants operator access from 192.168.4.0/24.</text>
<text x="72" y="918" font-size="18" fill="#334155" font-weight="400">Teleport allows Internal, Servers, Trusted, Family, IoT and Cameras; destination firewalls still apply.</text>
<text x="72" y="952" font-size="18" fill="#334155" font-weight="400">The watchdog is source-only / not installed. No automatic recovery or redundant router is implied by this diagram.</text>
<text x="72" y="986" font-size="18" fill="#334155" font-weight="400">Cellular Teleport web checks passed; full-estate admin reachability remains unverified.</text>
<text x="50" y="1038" font-size="16" fill="#946018" font-weight="400">Maintenance: Heimdall → Factory SSH receipts; Kuma outcome + schedule HTTPS verified. Forgejo restore verified.</text>
<text x="50" y="1062" font-size="16" fill="#64748b" font-weight="400">Sources: inventory/homelab.md#remote-access-tailscale • stacks/vyas-tailscale/README.md • docs/network/README.md</text>
